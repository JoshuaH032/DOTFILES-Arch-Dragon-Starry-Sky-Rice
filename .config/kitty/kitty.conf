# ──────────────────────────────────────────────
# Kitty — Starry Sky (Van Gogh Edition)
# ──────────────────────────────────────────────

# Fonts
font_family      CaskaydiaCove Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# Cursor
cursor_shape beam
cursor_beam_thickness 1.2
cursor_underline_thickness 2.0
cursor_blink_interval 0
cursor_stop_blinking_after 15.0
cursor_text_color #0a0a18
cursor #F1E9B9

# Window
window_padding_width 10
background_opacity 0.93
dynamic_background_opacity yes
hide_window_decorations yes
confirm_os_window_close 0

# Tab bar
tab_bar_style powerline
tab_bar_edge top
tab_bar_min_tabs 1
tab_powerline_style angled
tab_title_template "{index}: {title}"
active_tab_foreground #F1E9B9
active_tab_background #1C1F4A
inactive_tab_foreground #7BA6FF
inactive_tab_background #14152E

# Colors
foreground #EAE9E3
background #0F1028

selection_background #F1E9B9
selection_foreground #0F1028

cursor_text_color #0F1028
cursor #7BA6FF

# Normal colors
color0  #12132B
color1  #A85757
color2  #6FAF96
color3  #D7A84F
color4  #4377D5
color5  #8C6CD4
color6  #62A6D1
color7  #EAE9E3

# Bright colors
color8  #444567
color9  #CC7D7D
color10 #9ED2B0
color11 #FFD97A
color12 #7BA6FF
color13 #A38DFE
color14 #7FC6FF
color15 #FFFFFF

# URL + bell
url_color #F1E9B9
bell_border_color #7BA6FF

# Scrolling
scrollback_lines 10000
repaint_delay 7
input_delay 1
sync_to_monitor yes

# Copy/Paste
clipboard_control write-clipboard write-primary
copy_on_select yes

# Shell Integration
enable_audio_bell no
allow_remote_control yes
startup_session none
