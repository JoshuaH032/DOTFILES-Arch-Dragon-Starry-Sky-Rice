# Hyprland — Starry Sky Edition 🌠
# =========================================

monitor = eDP-1,preferred,auto,1.066667

# --- Environment ---
env = XDG_CURRENT_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = XCURSOR_THEME,BreezeX-RosePineDawn-Linux
env = XCURSOR_SIZE,24

# --- Input ---
input {
  kb_layout = us
  follow_mouse = 1
  touchpad {
    natural_scroll = true
    disable_while_typing = true
  }
}

# --- Aesthetics ---
general {
  gaps_in = 6
  gaps_out = 12
  border_size = 2
  col.active_border   = rgb(7aa2f7) rgb(ffc777) 45deg    # starlight gradient
  col.inactive_border = rgba(35,40,68,0.6)
}

decoration {
  rounding = 10
  active_opacity = 0.97
  inactive_opacity = 0.92

  blur {
    enabled = true
    size = 8
    passes = 2
    ignore_opacity = true
  }
}

animations {
  enabled = yes
  bezier = smooth, 0.4, 0.02, 0.2, 1.0
  animation = windows, 1, 3, smooth
  animation = fade, 1, 2, smooth
  animation = workspaces, 1, 3, smooth
  animation = layers, 1, 3, smooth
}

layerrule = blur, waybar
layerrule = blur, wofi
layerrule = blur, hyprlock

# --- Autostart ---
exec-once = /usr/lib/lxqt-policykit/lxqt-policykit-agent
exec-once = swww-daemon
exec-once = swww img /home/joshuah/Pictures/starry-night-van-goh.jpg --transition-type grow --transition-fps 60 --transition-duration 2
exec-once = waybar
exec-once = dunst
exec-once = sh -c 'sleep 2; pgrep -x nm-applet >/dev/null || nm-applet --indicator'
exec-once = sh -c 'sleep 2; pgrep -x blueman-applet >/dev/null || blueman-applet'
exec-once = hypridle
exec-once = hyprlock --daemon

# --- Keybinds ---
bind = SUPER, Return, exec, kitty
bind = SUPER, SPACE, exec, wofi --show drun
bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen
bind = SUPER, S, exec, grim -g "$(slurp)" - | wl-copy

# Focus movement
bind = SUPER, H, movefocus, l
bind = SUPER, J, movefocus, d
bind = SUPER, K, movefocus, u
bind = SUPER, L, movefocus, r

# Window movement
bind = SUPER_SHIFT, H, movewindow, l
bind = SUPER_SHIFT, J, movewindow, d
bind = SUPER_SHIFT, K, movewindow, u
bind = SUPER_SHIFT, L, movewindow, r

# Misc reload
bind = SUPER_SHIFT, C, exec, hyprctl reload

# Media & brightness
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86MonBrightnessUp,   exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

bind = SUPER_SHIFT, 1, movetoworkspace, 1
bind = SUPER_SHIFT, 2, movetoworkspace, 2
bind = SUPER_SHIFT, 3, movetoworkspace, 3
bind = SUPER_SHIFT, 4, movetoworkspace, 4
bind = SUPER_SHIFT, 5, movetoworkspace, 5
bind = SUPER_SHIFT, 6, movetoworkspace, 6
bind = SUPER_SHIFT, 7, movetoworkspace, 7
bind = SUPER_SHIFT, 8, movetoworkspace, 8
bind = SUPER_SHIFT, 9, movetoworkspace, 9
bind = SUPER_SHIFT, 0, movetoworkspace, 10

bind = SUPER, TAB, workspace, +1
bind = SUPER_SHIFT, TAB, workspace, -1

bind = SUPER_CTRL, 1, movetoworkspace, 1, follow
bind = SUPER_CTRL, 2, movetoworkspace, 2, follow
bind = SUPER_CTRL, 3, movetoworkspace, 3, follow
bind = SUPER_CTRL, 4, movetoworkspace, 4, follow
bind = SUPER_CTRL, 5, movetoworkspace, 5, follow

# --- Power Keybinds ---
bind = SUPER, ESC, exec, ~/.local/bin/powermenu

# --- Visual polish ---
animations {
  animation = fadeIn, 1, 2, smooth
  animation = fadeOut, 1, 2, smooth
}

# --- Motto ---
# “Serenity through precision, even under a starry sky.”
