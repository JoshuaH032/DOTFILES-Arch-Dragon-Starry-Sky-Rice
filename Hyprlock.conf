# ── Hyprlock — Starry Sky Lock Screen 🌌 ──

background {
  path = /home/joshuah/Pictures/starry-night-van-goh.jpg
  blur_passes = 3
  blur_size = 6
  brightness = 0.85
}

input-field {
  monitor = eDP-1
  size = 300, 40
  outline_thickness = 2
  rounding = 10
  dots_size = 0.3
  dots_spacing = 0.25
  fade_on_empty = true
  inner_color = rgba(28,31,74,0.55)
  outer_color = rgba(241,233,185,0.25)
  font_color = rgba(241,233,185,0.85)
  placeholder_text = "Enter the key to the stars..."
}

label {
  text = "Locked — Goodnight, Arch-Dragon 🌙"
  font_size = 18
  font_color = rgba(241,233,185,0.9)
  position = 0, -150
}

label {
  text = "$TIME"
  font_size = 28
  font_color = rgba(123,166,255,0.9)
  position = 0, -200
}

effect {
  blur = 8
  vignette = 0.2
  brightness = 0.9
}
